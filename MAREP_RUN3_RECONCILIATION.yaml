# Dispositions for Run 3's three unresolved findings.
#
# All three ended `unresolved` because every voting agent abstained. That is
# the terminal status working, but it collapses three different situations
# into one word: a finding whose count was misread, a finding whose subject is
# real but whose proposition is not supportable, and a finding that was never
# a finding at all because it proposed an action.
#
# RUN3_STATE.yaml is not modified, for the same reason RUN1_STATE.yaml was not.
# It records what the run concluded from the substrate it was given.

reconciled_at_commit: 42e8126
run: valuenet-run3
state: examples/_run/RUN3_STATE.yaml

findings:

  - id: LEXICON-004
    was: unresolved
    disposition: superseded
    supersedes_to: IRI-005
    summary: >-
      Superseded by IRI-005, and the agents who objected were right. The
      finding read 378 cross-group class IRIs as 378 semantic naming
      collisions. Checked directly: all 378 are the same file pair,
      ThatsAllFolks/folk.ttl against folk_aligned.ttl, and 325 of them are that
      pair and nothing else - the remainder add a third file but always include
      both. There is one governance question here, not 378: which of two
      near-copies of a module is canonical. The two files hold 5,828 triples
      each and are not isomorphic, so it is a real question, and a single one.
    evidence:
      - Group pairing is repository-root + thats-all-folks for all 378, with no
        other pair contributing any.
      - 325 of 378 are exactly folk.ttl + folk_aligned.ttl.
      - The instrument has been corrected. cross_group_file_pairings now ships
        beside the IRI count and reports 4, which is the number of ownership
        decisions actually pending.

  - id: LANG-002
    was: unresolved
    disposition: unresolved-rewrite
    summary: >-
      Correctly unresolved, and to be rewritten rather than archived. The
      multilingual pattern is real and measured - 889 of 3,658 ThatsAllFolks
      Wiktionary triggers are French, 147 of 624 at repository-root - and
      nothing in the corpus records which lexicon governs a term. But the
      proposition as written claims LANG-001 understates the pattern "by
      roughly three orders of magnitude", and several agents rejected that
      independently because it compares unlike quantities: LANG-001 counted
      value *terms* taking a French gloss, and 889 counts *trigger statements*
      with a French subject. Three terms and 889 statements are not the same
      unit and their ratio is not a magnitude of understatement.
      This is what unresolved should mean. There is something here; the current
      proposition is not supportable. Rewrite against a like-for-like count -
      how many distinct folk value classes have at least one French-subject
      trigger - and resubmit.
    evidence:
      - ALIGN-005 already establishes the sharper and separately confirmed
        point - French Wiktionary IRIs sit in subject position, so they are
        trigger sources rather than glosses, which makes LANG-001 wrong about
        the kind of thing they are and not only the count.

  - id: SHACL-004
    was: unresolved
    disposition: reformulate-as-fact-plus-action
    summary: >-
      Not a status problem but a lifecycle one, and it does not want a new
      status. The proposition is literally a recommendation - "do not write
      shapes for the vale2024, moral-molecules or mf-triggers class layers" -
      and agents cannot confirm a recommendation on evidence, so they
      abstained and it fell through to unresolved.
      Findings state what is true; actions state what should be done. The
      factual core is confirmable as it stands: class-targeted instance shapes
      over these three graphs have no focus nodes, because the groups declare
      no individuals. The recommendation belongs in the actions phase, which
      the protocol already has, rather than smuggled into a finding title.
    reformulated_as:
      title: >-
        Class-targeted instance shapes over the vale2024, moral-molecules and
        mf-triggers graphs bind zero focus nodes, because those groups declare
        no individuals
      status: confirmable
      then_action: >-
        Do not invest in class-targeted shapes for those three layers until
        they carry instances; retarget to predicates per SHACL-001.
    evidence:
      - individuals_declared is 0 for vale2024, moral-molecules and mf-triggers.
      - mf-triggers declares 0 classes and 0 individuals while carrying 12,338
        vcvf:triggers statements, so the construct worth validating there is a
        predicate, not a class.
      - SHACL-001, which states the predicate-retargeting fact rather than a
        recommendation, was confirmed with 7 of 7 evidence items verified.

# A note on the run as a whole, which shapes what comes next.
#
# Run 3's actions phase waived every confirmed issue rather than attaching
# accepted actions. Read plainly: Run 3 diagnosed the corpus and did not
# remediate it. That is a reasonable outcome for a discovery run and it means
# the next stage is not Run 4. Three runs have produced enough evidence; the
# work now is specific ontology and governance decisions, tracked in
# MAREP_IMPLEMENTATION_PLAN.md.
