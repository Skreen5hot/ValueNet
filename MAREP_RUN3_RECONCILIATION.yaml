# Dispositions for six Run 3 findings.
#
# Three ended `unresolved` because every voting agent abstained. That is
# the terminal status working, but it collapses three different situations
# into one word: a finding whose count was misread, a finding whose subject is
# real but whose proposition is not supportable, and a finding that was never
# a finding at all because it proposed an action.
#
# The other three were confirmed on a premise I supplied and that was false:
# the Run 3 Alignment brief said vcvf:triggers has no domain and no range. It
# declares both. Their conclusions survive; their supporting sentences about
# the predicate's constraints do not. That failure is why the grounding gate
# now distinguishes a claim the record supports from one that merely cites it.
#
# RUN3_STATE.yaml is not modified, for the same reason RUN1_STATE.yaml was not.
# It records what the run concluded from the substrate it was given.

reconciled_at_commit: 42e8126
run: valuenet-run3
state: examples/_run/RUN3_STATE.yaml

findings:

  - id: LEXICON-004
    was: unresolved
    disposition: superseded
    supersedes_to: IRI-005
    summary: >-
      Superseded by IRI-005, and the agents who objected were right. The
      finding read 378 cross-group class IRIs as 378 semantic naming
      collisions. Checked directly: all 378 are the same file pair,
      ThatsAllFolks/folk.ttl against folk_aligned.ttl, and 325 of them are that
      pair and nothing else - the remainder add a third file but always include
      both. There is one governance question here, not 378: which of two
      near-copies of a module is canonical. The two files hold 5,828 triples
      each and are not isomorphic, so it is a real question, and a single one.
    evidence:
      - Group pairing is repository-root + thats-all-folks for all 378, with no
        other pair contributing any.
      - 325 of 378 are exactly folk.ttl + folk_aligned.ttl.
      - The instrument has been corrected. cross_group_file_pairings now ships
        beside the IRI count and reports 4, which is the number of ownership
        decisions actually pending.

  - id: LANG-002
    was: unresolved
    disposition: rewritten
    summary: >-
      Rewritten on like-for-like units, and the result refutes LANG-001 rather
      than understating it. The original proposition claimed LANG-001
      understates the French pattern "by roughly three orders of magnitude",
      comparing value terms against trigger statements - different units whose
      ratio is not a magnitude of anything, which is why every voting agent
      declined to confirm it.
      Measured in one unit, value classes: 133 of the 147 value classes that
      carry any trigger have at least one French Wiktionary trigger, 90 percent
      of them, rising to 123 of 125 among folk values. And the number that
      matters most: ZERO value classes have a French trigger without also
      having an English one. Every one of the 133 is bilingual.
      So French is not an exception applied to a few terms. It is a systematic
      en+fr pairing applied to almost the whole vocabulary. LANG-001's framing -
      "three value terms take their lexical gloss from a French dictionary
      while the rest use English" - is wrong about the count, wrong about the
      kind of thing (ALIGN-005: these are trigger sources, not glosses), and
      wrong that the rest differ.
    rewritten_as:
      title: >-
        The trigger layer is systematically bilingual: 133 of 147 value classes
        carry both English and French Wiktionary triggers, and none carries
        French alone
      status: confirmable
      consequence: >-
        There is no lexicon cleanup to do here. The open question is only
        whether the corpus should state that it is en+fr by design, since
        nothing records it. Implementation plan section 3 is narrowed
        accordingly, and SHACL-003's proposed lexicon-edition shape would flag
        133 values - that is, it would flag the design rather than a defect.

  - id: SHACL-004
    was: unresolved
    disposition: reformulate-as-fact-plus-action
    summary: >-
      Not a status problem but a lifecycle one, and it does not want a new
      status. The proposition is literally a recommendation - "do not write
      shapes for the vale2024, moral-molecules or mf-triggers class layers" -
      and agents cannot confirm a recommendation on evidence, so they
      abstained and it fell through to unresolved.
      Findings state what is true; actions state what should be done. The
      factual core is confirmable as it stands: class-targeted instance shapes
      over these three graphs have no focus nodes, because the groups declare
      no individuals. The recommendation belongs in the actions phase, which
      the protocol already has, rather than smuggled into a finding title.
    reformulated_as:
      title: >-
        Class-targeted instance shapes over the vale2024, moral-molecules and
        mf-triggers graphs bind zero focus nodes, because those groups declare
        no individuals
      status: confirmable
      then_action: >-
        Do not invest in class-targeted shapes for those three layers until
        they carry instances; retarget to predicates per SHACL-001.
    evidence:
      - individuals_declared is 0 for vale2024, moral-molecules and mf-triggers.
      - mf-triggers declares 0 classes and 0 individuals while carrying 12,338
        vcvf:triggers statements, so the construct worth validating there is a
        predicate, not a class.
      - SHACL-001, which states the predicate-retargeting fact rather than a
        recommendation, was confirmed with 7 of 7 evidence items verified.

  - id: ALIGN-002
    was: confirmed
    disposition: premise-false-conclusion-survives
    summary: >-
      Rests on a false premise I supplied. The Run 3 Alignment brief said
      vcvf:triggers has no domain, no range and no definition. It declares
      rdfs:domain owl:Thing and rdfs:range vcvf:Value at ValueCore.ttl:97; only
      the definition was missing. The finding's own conclusion - that one
      undefined predicate carries the trigger claims of three groups - survives,
      because "undefined" is the true part. Its supporting sentences about
      domain and range do not.
    evidence:
      - The predicate declares both, verified directly against the merged graph.
      - The grounding gate marked the claim verified because the citation
        resolved. It now returns resolves_only for exactly this shape.

  - id: SHACL-002
    was: confirmed
    disposition: premise-false-conclusion-survives
    summary: >-
      Same false premise, and the conclusion is strengthened rather than
      weakened by the correction. The finding says the direction convention is
      the one unstated commitment with tens of thousands of nodes able to
      violate it, and cites "no domain, no range" as the reason OWL cannot
      constrain direction. The real reason is better: the range is declared, and
      it entails rather than validates - an object of the wrong kind is inferred
      to be a Value instead of being rejected. OWL cannot catch a direction
      error here not because the predicate is unconstrained but because the
      constraint it has runs the wrong way for the job. Still a SHACL
      obligation, for a sharper reason.
    evidence:
      - folk:BadHealth is entailed to be a vcvf:Value from a single trigger
        statement under RDFS closure, verified directly.
      - 18,668 thats-all-folks trigger statements place the external resource
        in subject position and zero place one in object position.

  - id: MAPPING-001
    was: confirmed
    disposition: premise-false-conclusion-survives
    summary: >-
      The central claim - that trigger statements are being read as external
      alignments when the measurements say they are not - is unaffected and was
      independently corroborated by ALIGN-001 and ALIGN-005. Only its
      characterisation of the predicate as wholly unconstrained inherits the
      false premise.
    evidence:
      - Direction is a total convention in the data with zero counterexamples.
      - The predicate's declared range is what makes a misread trigger
        statement silently acceptable rather than detectably wrong.

# A note on the run as a whole, which shapes what comes next.
#
# Run 3's actions phase waived every confirmed issue rather than attaching
# accepted actions. Read plainly: Run 3 diagnosed the corpus and did not
# remediate it. That is a reasonable outcome for a discovery run and it means
# the next stage is not Run 4. Three runs have produced enough evidence; the
# work now is specific ontology and governance decisions, tracked in
# MAREP_IMPLEMENTATION_PLAN.md.
