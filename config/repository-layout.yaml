  - id: manifest-identity-bfo-bfo-core-ttl
    file: tests/test_destination_state.py
    literal: BFO/bfo-core.ttl
    field: assertion
    category: manifest-identity
    owner: unowned
    justification: >-
      A manifest identity, not a location. Grouping and baseline maps are
