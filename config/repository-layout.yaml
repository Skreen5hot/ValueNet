# Repository layout contract.
#
# One declaration per component, addressed by a logical id. Everything that
# needs a path asks this file for it, so a move is a change here rather than an
# edit across twenty modules.
#
# `path` is where the component lives now. `moves_to` records where the
# reorganization will put it, and is null for retained components. During the
# migration the resolver returns whichever of the two currently exists, so a
# half-moved tree resolves correctly and no consumer needs to know which wave
# has run.
#
# Ids are stable across the move. That is the point: `# scope: component:...`
# in an executable query document, or a group name in the MAREP corpus source,
# survives relocation untouched.

version: 1

components:

  # ---- Original ValueNet corpus. Retained at upstream-compatible paths. ----

  - id: original-valuenet.folk-fragments
    path: ThatsAllFolks
    moves_to: null
    role: corpus-group
    corpus_group: thats-all-folks
    description: >-
      The 127 folk value trigger fragments, folk.ttl and taf.ttl. Upstream-
      derived and locally repaired.

  - id: original-valuenet.mf-triggers
    path: MFTriggers
    moves_to: null
    role: corpus-group
    corpus_group: mf-triggers

  - id: original-valuenet.moral-molecules
    path: MoralMolecules
    moves_to: null
    role: corpus-group
    corpus_group: moral-molecules

  - id: original-valuenet.vale2024
    path: vale2024
    moves_to: null
    role: corpus-group
    corpus_group: vale2024

  - id: original-valuenet.folk-source
    path: ThatsAllFolks/folk.ttl
    moves_to: null
    role: generator-source
    description: The authored source for the generated alignment view.

  - id: original-valuenet.folk-aligned
    path: folk_aligned.ttl
    moves_to: null
    role: generated-artifact
    generated_from: original-valuenet.folk-source
    generator: tool.generate-folk-aligned

  # ---- BFO-aligned ValueNet. Moves in wave 7. ----
  #
  # Corpus grouping is prefix-based, not directory-based, and the two are not
  # interchangeable. The hardcoded rule is "BFO/valuenet-" -> bfo-layer and
  # "BFO/" -> bfo-vendored, so bfo-core.ttl, the CCO extract and the two
  # vcvf-triggers files are vendored. Modelling bfo.core as the whole BFO
  # directory moved three of those into bfo-layer the moment the contract was
  # adopted, silently reclassifying files the reorganization is not supposed to
  # touch.
  #
  # Each component therefore declares the prefixes that select the SAME logical
  # files before and after the move. `group_prefixes` and `group_prefixes_after`
  # must denote the same set.

  - id: bfo.core
    path: BFO
    moves_to: ontology/bfo/core
    role: corpus-group
    corpus_group: bfo-layer
    members:
      - BFO/valuenet-core.ttl
      - BFO/valuenet-core-shapes.ttl
      - BFO/valuenet-folk.ttl
      - BFO/valuenet-mappings.ttl
      - BFO/valuenet-schwartz-values.ttl
      - BFO/valuenet-moral-foundations.ttl
      - BFO/valuenet-moral-epistemics.ttl
      - BFO/valuenet-moral-epistemics-scenario.ttl
      - BFO/valuenet-moral-epistemics-shapes.ttl
    members_after:
      - ontology/bfo/core/valuenet-core.ttl
      - ontology/bfo/shapes/valuenet-core-shapes.ttl
      - ontology/bfo/core/valuenet-folk.ttl
      - ontology/bfo/core/valuenet-mappings.ttl
      - ontology/bfo/core/valuenet-schwartz-values.ttl
      - ontology/bfo/extensions/moral-foundations/valuenet-moral-foundations.ttl
      - ontology/bfo/extensions/moral-epistemics/valuenet-moral-epistemics.ttl
      - ontology/bfo/extensions/moral-epistemics/valuenet-moral-epistemics-scenario.ttl
      - ontology/bfo/shapes/valuenet-moral-epistemics-shapes.ttl
    description: >-
      Exact membership, not prefixes. The live rule is "BFO/valuenet-" ->
      bfo-layer, which is a property of the FILENAME; the destinations sort the
      same files by ROLE, so the two SHACL files land under shapes/ beside
      vcvf-triggers-shapes.ttl, which is vendored. No prefix over the
      destination tree can separate them, and the prefix version silently
      reclassified three files after the move while reporting zero changes
      against the unmoved tree.

  - id: bfo.vendored
    path: BFO
    moves_to: ontology/bfo/vendor
    role: corpus-group
    corpus_group: bfo-vendored
    members:
      - BFO/bfo-core.ttl
      - BFO/imports/cco-valuenet-extract.ttl
      - BFO/vcvf-triggers-semantics.ttl
      - BFO/vcvf-triggers-shapes.ttl
    members_after:
      - ontology/bfo/vendor/bfo/bfo-core.ttl
      - ontology/bfo/vendor/cco/cco-valuenet-extract.ttl
      - ontology/bfo/extensions/trigger-semantics/vcvf-triggers-semantics.ttl
      - ontology/bfo/shapes/vcvf-triggers-shapes.ttl
    description: >-
      Everything under BFO/ that is not a valuenet- module. vcvf-triggers-
      semantics moves under extensions/ and stays vendored; grouping follows
      the file, not the directory it lands in.

  - id: bfo.vendor-bfo
    path: BFO/bfo-core.ttl
    moves_to: ontology/bfo/vendor/bfo/bfo-core.ttl
    role: vendored-ontology

  - id: bfo.vendor-cco
    path: BFO/imports
    moves_to: ontology/bfo/vendor/cco
    role: vendored-ontology
    description: >-
      The pinned CCO MIREOT extract. Must be in the reasoner scope: omitting it
      silently dropped the BFO layer from 306 classes to 275.

  - id: bfo.reasoner-scope
    path: BFO
    moves_to: ontology/bfo
    role: reasoner-scope
    members:
      - BFO/bfo-core.ttl
      - BFO/valuenet-core.ttl
      - BFO/valuenet-schwartz-values.ttl
      - BFO/valuenet-moral-foundations.ttl
      - BFO/valuenet-folk.ttl
      - BFO/valuenet-moral-epistemics.ttl
      - BFO/valuenet-mappings.ttl
    members_after:
      - ontology/bfo/vendor/bfo/bfo-core.ttl
      - ontology/bfo/core/valuenet-core.ttl
      - ontology/bfo/core/valuenet-schwartz-values.ttl
      - ontology/bfo/extensions/moral-foundations/valuenet-moral-foundations.ttl
      - ontology/bfo/core/valuenet-folk.ttl
      - ontology/bfo/extensions/moral-epistemics/valuenet-moral-epistemics.ttl
      - ontology/bfo/core/valuenet-mappings.ttl
    plus_directory: bfo.vendor-cco
    description: >-
      The exact HermiT scope, listed rather than globbed. The hardcoded list
      omitted BFO/imports/ and the reasoner dropped from 306 classes to 275
      while every test stayed green.

  - id: bfo.ontology-tree
    path: BFO
    moves_to: ontology/bfo
    role: query-scope
    description: >-
      Every .ttl under the BFO tree, which is what "# scope: BFO/" selects
      today. After the wave the same files sit under ontology/bfo across core/,
      extensions/, shapes/ and vendor/, so the id denotes the same set on both
      sides while the literal path does not.

  - id: bfo.shapes
    path: BFO
    moves_to: ontology/bfo/shapes
    role: shape-set
    pattern: "*-shapes.ttl"

  - id: bfo.scenario
    path: BFO/valuenet-moral-epistemics-scenario.ttl
    moves_to: ontology/bfo/extensions/moral-epistemics/valuenet-moral-epistemics-scenario.ttl
    role: instance-data

  # ---- Executable query documents. Addressed by id, never by path. ----

  - id: bfo.query-suite.competency
    path: BFO/valuenet-moral-epistemics-CQ.md
    moves_to: ontology/bfo/extensions/moral-epistemics/valuenet-moral-epistemics-CQ.md
    role: executable-queries
    expect: rows

  - id: bfo.query-suite.sanity
    path: BFO/TestingFramework.md
    moves_to: docs/bfo/guides/TestingFramework.md
    role: executable-queries
    expect: no-rows

  # ---- MAREP. Implementation retained; documents and examples move. ----

  - id: marep.implementation
    path: marep
    moves_to: null
    role: python-package

  - id: marep.examples
    path: examples
    moves_to: examples/marep
    role: example-programs

  - id: marep.run-artifacts
    path: examples/_run
    moves_to: examples/marep/_run
    role: generated-run-state
    description: >-
      Never committed. .gitignore must cover both the old and new locations
      during migration; the current directory holds 1,127,251 bytes.

  # ---- Configuration. Retained. ----

  - id: config.layout
    path: config/repository-layout.yaml
    moves_to: null
    role: configuration

  - id: config.move-manifest
    path: config/move-manifest.yaml
    moves_to: null
    role: configuration

  - id: config.semantic-baseline
    path: config/reorganization-baseline.json
    moves_to: null
    role: configuration

  # ---- Generators, so a generated artifact's `generator` field resolves. ----

  - id: tool.generate-folk-aligned
    path: ValueNet_code/generate_folk_aligned.py
    moves_to: tools/original-valuenet/generate_folk_aligned.py
    role: generator

  - id: tool.generate-cco-extract
    path: BFO/remediation/generate_cco_extract.py
    moves_to: tools/bfo/generate_cco_extract.py
    role: generator

  - id: tool.build-move-manifest
    path: ValueNet_code/build_move_manifest.py
    moves_to: tools/marep/build_move_manifest.py
    role: generator

  - id: tool.build-semantic-baseline
    path: ValueNet_code/build_semantic_baseline.py
    moves_to: tools/marep/build_semantic_baseline.py
    role: generator

  - id: tool.validate-migration-state
    path: ValueNet_code/validate_migration_state.py
    moves_to: tools/marep/validate_migration_state.py
    role: checker
    description: >-
      Asserts that the tree is in a state the manifest describes: for every
      MOVE row exactly one of source and destination is tracked. Declared
      so its own tests can resolve it rather than naming ValueNet_code/.
  - id: tool.check-destination-state
    path: ValueNet_code/check_destination_state.py
    moves_to: tools/marep/check_destination_state.py
    role: checker
    description: >-
      Materialises the post-move tree in a temporary directory and asks
      every consumer whether it still resolves. Declared here because its
      own test loads it by path, and a literal ValueNet_code/ path in that
      test would break on the marep wave -- the defect the checker exists
      to catch, one level up.

  # ---- Path allowances: occurrences that are correct as literal paths. ----

# Path allowances: literal path occurrences that are correct as written.
#
# `file` is where the occurrence lives. `literal` is the path string that
# appears there — one entry per occurrence, so a checker can prove zero-match,
# complete coverage and non-overlap mechanically. The earlier version put the
# containing file in `match`, which named neither the occurrence nor a pattern
# and so could not support any of those checks.
#
# `owner` names a component id from this file, or `unowned` where no component
# is responsible.
#
# Lifecycle: `permanent: true`, or `remove_after_wave` naming the wave after
# which the allowance must be gone. Step 6 checks that every allowance matches
# at least one real occurrence, every literal-path occurrence outside the
# resolver is covered by exactly one allowance, and no expired allowance
# survives its wave.

path_allowances:

  - id: run1-reconciliation-state-path
    file: MAREP_RUN1_RECONCILIATION.yaml
    literal: examples/_run/RUN1_STATE.yaml
    field: state
    category: historical-record
    owner: unowned
    justification: >-
      Records where the state file WAS when Run 1 observed it. Rewriting would
      falsify the audit trail the reconciliation model depends on.
    permanent: true

  - id: run1-reconciliation-test-path
    file: MAREP_RUN1_RECONCILIATION.yaml
    literal: tests/test_ontology_artifacts.py
    field: findings[].evidence
    category: historical-record
    owner: unowned
    justification: >-
      Names the test that held the invariant at the time of writing. The test
      moves in the tests wave; this sentence describes the past.
    permanent: true

  - id: run3-reconciliation-state-path
    file: MAREP_RUN3_RECONCILIATION.yaml
    literal: examples/_run/RUN3_STATE.yaml
    field: state
    category: historical-record
    owner: unowned
    justification: as above, for Run 3
    permanent: true

  - id: manifest-builder-exact-table
    file: ValueNet_code/build_move_manifest.py
    pattern: "\"(BFO|ValueNet_code|tests|marep|examples|docs|ontology|tools|config)/"
    field: EXACT, DIR_PREFIXES, NAME_PREFIXES, AUTHORED_AT_TARGET
    category: bootstrap
    owner: tool.build-move-manifest
    justification: >-
      The builder defines the mapping and cannot resolve paths through a
      contract it is producing. A pattern rather than a literal, because the
      table names every source and destination in the repository.
    permanent: true

  - id: folk-aligned-generated-header-source
    file: folk_aligned.ttl
    literal: ThatsAllFolks/folk.ttl
    field: GENERATED FILE header, Source
    category: generated-metadata
    owner: tool.generate-folk-aligned
    justification: >-
      Names its source so nobody edits the generated file by hand. The source
      is RETAIN, so this literal does not change.
    permanent: true

  - id: folk-aligned-generated-header-generator
    file: folk_aligned.ttl
    literal: ValueNet_code/generate_folk_aligned.py
    field: GENERATED FILE header, Generator
    category: generated-metadata
    owner: tool.generate-folk-aligned
    justification: >-
      Names its generator. Regenerated in the original-valuenet wave; the byte
      hash changes and the canonical digest does not.
    permanent: false
    discharge: regenerate
    remove_after_wave: original-valuenet

  # ---- Populated in step 6. Every literal-path occurrence in an
  # executable or generated file that is not resolved through the
  # contract now has exactly one entry, so the checker can prove
  # coverage rather than assume it. Prose documents are out of scope and
  # counted separately; step 12 checks their links.

  - id: cross-ref-thatsallfolks-folk-ttl-to-bfo-vcvf-triggers-review-md
    file: ThatsAllFolks/folk.ttl
    literal: BFO/vcvf-triggers-review.md
    field: prov:wasAttributedTo
    category: historical-record
    owner: original-valuenet.folk-source
    justification: >-
      Inside a prov:wasAttributedTo object literal, not a comment. It
      records where the review document was when five modelling
      decisions were attributed to it. Rewriting it changes five
      triples and the file's canonical digest -- a semantic ontology
      edit combined with a relocation, which the plan forbids and the
      baseline records as an invariant -- and it would falsify a
      provenance statement about the past. Reclassified from an edit
      expiring after the bfo wave, which was generated by treating a
      triple as prose.
    permanent: true

  - id: cross-ref-valuenet-code-add-folk-religion-py-to-valuenet-code-generate-folk-aligned-py
    file: ValueNet_code/add_folk_religion.py
    literal: ValueNet_code/generate_folk_aligned.py
    field: prose reference
    category: cross-reference
    owner: unowned
    justification: >-
      Names another file by path. The referent moves in the
      original-valuenet wave, which is where this reference is updated.
    permanent: false
    discharge: edit
    remove_after_wave: original-valuenet

  - id: cross-ref-valuenet-code-declare-folk-value-py-to-valuenet-code-generate-folk-aligned-py
    file: ValueNet_code/declare_folk_value.py
    literal: ValueNet_code/generate_folk_aligned.py
    field: prose reference
    category: cross-reference
    owner: unowned
    justification: >-
      Names another file by path. The referent moves in the
