[pytest]
markers =
    slow: parses the whole ontology corpus; excluded from the default run
    repository: asserts a property of this git repository in its frozen
        pre-move state -- tracked files, the manifest, the allowance list.
        Meaningless in a copy, so check_destination_state.py deselects it
        when it runs the suite inside a materialised tree. Part of the
        default run everywhere else.
addopts = -m "not slow"
